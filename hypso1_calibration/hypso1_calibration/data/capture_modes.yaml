# HYPSO-1 imaging modes -> which calibration coefficient files this package
# provides for each. Filenames only (resolved against this package's own
# data/ directory - see get_hypso1_calibration_files).
#
# Keys omitted for a mode fall back to the coeff_type-driven default
# (radiometric/spectral - see get_hypso1_calibration_files) or None
# (smile/destriping - no correction applied for that coefficient type).
# A capture_type with no entry here at all gets every file nulled out,
# matching this function's historical "unknown capture_type" behavior.
#
# See hypso-package's hypso/hypso/sensors/hypso1_modes.yaml for the sibling
# schema deciding whether each of these files is used "as_is" (pre-baked for
# one specific bin_factor/AOI) or "crop_and_bin" (cropped/binned per-capture
# at read time) - that decision lives in hypso-package, not here, since it's
# about how the file relates to a given capture's own geometry, not about
# which file exists.
#
# Adding a future imaging mode: add an entry here (and the actual new .npz
# file(s) into data/) - no Python code changes needed.

custom:
  smile: spectral_calibration_matrix_HYPSO-1_full_v1.npz

nominal:
  smile: smile_correction_matrix_HYPSO-1_nominal_v1.npz
  destriping: destriping_matrix_HYPSO-1_nominal_v1.npz

wide:
  smile: smile_correction_matrix_HYPSO-1_wide_v1.npz
  destriping: destriping_matrix_HYPSO-1_wide_v1.npz

moon:
  # Overrides the coeff_type-driven radiometric default - see
  # get_hypso1_calibration_files. No moon-specific smile/destriping matrix
  # exists (moon captures don't share nominal/wide's frame geometry), so
  # smile falls back to the same full-frame matrix "custom" uses (cropped
  # per-capture at read time - "crop_and_bin", the default), and destriping
  # is skipped entirely, same as "custom".
  radiometric: radiometric_calibration_matrix_HYPSO-1_moon.npz
  smile: spectral_calibration_matrix_HYPSO-1_full_v1.npz
