reader:
  name: hypso_l1d
  short_name: HYPSO L1D
  long_name: HYPSO Level 1D Top-of-Atmosphere Reflectance
  description: >
    Reader for HYPSO-1/HYPSO-2 Level 1D (top-of-atmosphere reflectance) NetCDF
    files, as written by hypso.io.writer.write_l1d_nc_file. Per-band datasets
    (rhot_<wavelength>) are discovered dynamically at load time - see
    hypso.satpy.hypso_handler.HypsoL1FileHandler.available_datasets - since the
    exact band set varies by binning/calibration configuration, not fixed per
    sensor.
  reader: !!python/name:satpy.readers.core.yaml_reader.FileYAMLReader
  sensors: [hypso1, hypso2]

file_types:
  hypso_l1d_nc:
    file_reader: !!python/name:hypso.satpy.hypso_handler.HypsoL1FileHandler
    file_patterns:
    - '{capture_target}_{start_time:%Y-%m-%dT%H-%M-%SZ}-l1d.nc'
    - '{capture_target}_{start_time:%Y-%m-%dT%H-%M-%SZ}-{label}-l1d.nc'

datasets:
  latitude:
    name: latitude
    standard_name: latitude
    units: degree
    file_type: hypso_l1d_nc
  longitude:
    name: longitude
    standard_name: longitude
    units: degree
    file_type: hypso_l1d_nc
